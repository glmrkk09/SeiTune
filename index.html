<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0813">
<title>SeiTune download</title>
<meta name="description" content="Free, ad-free music and video player for Android.">
<link rel="icon" href="logo.png">
<style>
:root{
  --bg:#0b0813; --card:#141026; --card2:#1e1838; --fg:#f3f0ff; --mut:#a39bb8;
  --ac:#9d7bff; --ac2:#ff7bd5; --ac-glow:rgba(157,123,255,.4); --line:#2e264c; --ok:#20e070; --danger:#ff4d6d;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f4f0ff; --card:#ffffff; --card2:#e9e3f7; --fg:#18122b; --mut:#6a6182;
    --ac:#7c4dff; --ac2:#e0409f; --ac-glow:rgba(124,77,255,.25); --line:#d5cde8; --ok:#05b352; --danger:#d6284a;
  }
}
:root[data-theme="light"]{
  --bg:#f4f0ff; --card:#ffffff; --card2:#e9e3f7; --fg:#18122b; --mut:#6a6182;
  --ac:#7c4dff; --ac2:#e0409f; --ac-glow:rgba(124,77,255,.25); --line:#d5cde8; --ok:#05b352; --danger:#d6284a;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
  min-height:100vh;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:-1;
  background:
    radial-gradient(60% 38% at 50% 0%, var(--ac-glow), transparent 70%),
    radial-gradient(40% 30% at 100% 35%, rgba(255,123,213,.10), transparent 70%);
}
a{color:var(--ac)}
:focus-visible{outline:2px solid var(--ac); outline-offset:3px; border-radius:8px}
main{max-width:640px; margin:0 auto; padding:18px 18px 56px}
svg{flex:none}

/* top bar */
.bar{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:6px}
.links{display:flex; gap:8px; flex-wrap:wrap}
.chip, .bar button{
  display:inline-flex; align-items:center; gap:7px;
  font:inherit; font-size:14px; font-weight:600; color:var(--fg); text-decoration:none;
  background:var(--card); border:1px solid var(--line); border-radius:99px; padding:7px 13px; cursor:pointer;
  transition:border-color .2s, transform .2s;
}
.chip:hover, .bar button:hover{border-color:var(--ac); transform:translateY(-1px)}
.chip svg{width:16px; height:16px; fill:currentColor}

/* hero */
.hero{text-align:center; padding:14px 0 22px}
.icon{
  width:116px; height:116px; border-radius:28px; object-fit:cover; background:var(--card2);
  box-shadow:0 16px 44px var(--ac-glow), 0 0 0 1px var(--line), 0 0 0 7px rgba(157,123,255,.10);
}
h1{
  font-size:2.5rem; line-height:1.1; margin:20px 0 8px; letter-spacing:-.02em;
  background:linear-gradient(90deg,var(--fg),var(--ac) 70%,var(--ac2)); -webkit-background-clip:text; background-clip:text; color:transparent;
}
.by{margin:-2px 0 10px; font-size:13px; letter-spacing:.08em; color:var(--mut)}
.tag{color:var(--mut); margin:0 auto; max-width:30em}
.tags{display:flex; justify-content:center; flex-wrap:wrap; gap:8px; margin:16px 0 0; padding:0; list-style:none}
.tags li{font-size:13px; font-weight:600; color:var(--fg); background:var(--card); border:1px solid var(--line); border-radius:99px; padding:3px 11px}
.ver{display:inline-flex; gap:8px; align-items:center; margin-top:16px; font-size:14px; color:var(--mut)}
.pill{background:var(--card2); border:1px solid var(--line); color:var(--fg); border-radius:99px; padding:2px 11px; font-weight:700}

/* download buttons */
.dl{display:flex; flex-direction:column; gap:10px; margin:6px 0 10px}
.btn{
  display:flex; align-items:center; justify-content:space-between; gap:14px;
  text-decoration:none; color:var(--fg); background:linear-gradient(145deg,var(--card2),var(--card));
  border:1px solid var(--line); border-radius:18px; padding:14px 18px; font-weight:600;
  transition:transform .25s cubic-bezier(.34,1.56,.64,1), border-color .2s;
}
.btn:hover{transform:translateY(-2px); border-color:var(--ac)}
.btn small{display:block; font-weight:400; color:var(--mut); font-size:13px; word-break:break-all}
.btn .size{font-weight:600; font-size:14px; white-space:nowrap}
.btn.main{
  background:linear-gradient(135deg,var(--ac),var(--ac2)); color:#fff; border-color:transparent;
  box-shadow:0 12px 32px var(--ac-glow); padding:20px 20px; font-size:1.12rem; justify-content:flex-start;
}
.btn.main .txt{flex:1; min-width:0}
.btn.main small{color:rgba(255,255,255,.9)}
.btn.main .ico{
  width:46px; height:46px; border-radius:14px; background:rgba(255,255,255,.22);
  display:flex; align-items:center; justify-content:center;
}
.btn.main .ico svg{width:24px; height:24px; fill:none; stroke:#fff; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round}
.badge{
  display:inline-block; font-size:12px; font-weight:700; letter-spacing:.02em;
  background:rgba(255,255,255,.24); color:#fff; border-radius:99px; padding:1px 9px; margin-bottom:4px;
}
.sub{margin:8px 2px 0; font-size:14px; color:var(--mut); text-align:center}
.sub.warn{color:var(--fg); background:var(--card); border:1px solid var(--line); border-radius:12px; padding:9px 12px}
.other-h{font-size:.8rem; text-transform:uppercase; letter-spacing:.08em; color:var(--mut); margin:20px 2px 0}

.help{margin-top:14px}
.help .body{padding:12px 14px 14px; font-size:14px; color:var(--mut)}
.help .body p{margin:0 0 10px}
.help .body b{color:var(--fg)}

/* sections */
h2{font-size:1.1rem; margin:36px 0 12px; display:flex; align-items:center; gap:10px}
h2::before{content:""; width:4px; height:1.1em; border-radius:4px; background:linear-gradient(var(--ac),var(--ac2))}

/* rendered release notes */
.notes{
  background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px 18px;
  word-break:break-word; color:var(--fg); font-size:15px;
}
.notes > :first-child{margin-top:0}
.notes > :last-child{margin-bottom:0}
.notes h3{font-size:1.15rem; margin:0 0 8px}
.notes h4{font-size:.8rem; text-transform:uppercase; letter-spacing:.07em; color:var(--ac); margin:20px 0 8px}
.notes p{margin:0 0 12px; color:var(--fg)}
.notes ul, .notes ol{margin:0 0 12px; padding-left:20px}
.notes li{margin:4px 0}
.notes li::marker{color:var(--ac)}
.notes code{
  font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; background:var(--card2); border:1px solid var(--line);
  border-radius:7px; padding:1px 6px; word-break:break-all;
}
.notes hr{border:0; border-top:1px solid var(--line); margin:16px 0}
.tablewrap{overflow-x:auto; margin:0 0 14px; border:1px solid var(--line); border-radius:12px}
.notes table{border-collapse:collapse; width:100%; font-size:14px}
.notes th, .notes td{text-align:left; vertical-align:top; padding:9px 12px; border-bottom:1px solid var(--line)}
.notes th{background:var(--card2); font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--mut)}
.notes tr:last-child td{border-bottom:0}
.notes td:first-child{white-space:nowrap}

.feat{display:grid; grid-template-columns:1fr; gap:10px; padding:0; margin:0; list-style:none}
@media (min-width:520px){ .feat{grid-template-columns:1fr 1fr} }
.feat li{background:var(--card); border:1px solid var(--line); border-left:3px solid var(--ac); border-radius:14px; padding:12px 14px}
.feat b{display:block; margin-bottom:2px}
.feat span{color:var(--mut); font-size:14px}

details{background:var(--card); border:1px solid var(--line); border-radius:14px; margin-bottom:8px}
summary{cursor:pointer; padding:12px 14px; display:flex; justify-content:space-between; gap:10px; list-style:none; font-weight:600}
summary::-webkit-details-marker{display:none}
summary .d{color:var(--mut); font-size:14px; font-weight:400}
details[open] summary{border-bottom:1px solid var(--line)}
.old{padding:10px 14px 14px; display:grid; gap:8px}
.old a.file{
  display:flex; justify-content:space-between; gap:10px; text-decoration:none; color:var(--fg);
  background:var(--card2); border-radius:10px; padding:9px 12px; font-size:14px; word-break:break-all;
}
.old .notes{font-size:14px; padding:12px 14px; border-radius:12px}

.state{text-align:center; color:var(--mut); padding:26px 0}
.err{color:var(--danger)}
footer{margin-top:40px; text-align:center; color:var(--mut); font-size:13px}
footer a{color:var(--mut)}
@media (prefers-reduced-motion: reduce){ .btn, .chip, .bar button{transition:none} }
</style>
</head>
<body>
<main>
  <div class="bar">
    <div class="links">
      <a class="chip" id="srcLink" rel="noopener">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        Source
      </a>
      <a class="chip" id="issueLink" rel="noopener">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 9.5a1.5 1.5 0 100-3 1.5 1.5 0 000 3z"/><path d="M8 0a8 8 0 100 16A8 8 0 008 0zM1.5 8a6.5 6.5 0 1113 0 6.5 6.5 0 01-13 0z"/></svg>
        Issues
      </a>
    </div>
    <button id="themeBtn" type="button" aria-label="Switch theme">Theme</button>
  </div>

  <section class="hero">
    <img class="icon" id="icon" alt="SeiTune icon" width="116" height="116">
    <h1 id="name">SeiTune</h1>
    <div class="by" id="by"></div>
    <p class="tag" id="tagline"></p>
    <ul class="tags" id="tags"></ul>
    <div class="ver" id="ver" hidden></div>
  </section>

  <section id="downloads" aria-live="polite">
    <p class="state">Loading latest release...</p>
  </section>

  <section id="notesWrap" hidden>
    <h2>What is new</h2>
    <div class="notes" id="notes"></div>
  </section>

  <section id="featWrap" hidden>
    <h2>What it does</h2>
    <ul class="feat" id="feat"></ul>
  </section>

  <section id="oldWrap" hidden>
    <h2>Older versions</h2>
    <div id="old"></div>
  </section>

  <footer>
    <p id="foot"></p>
  </footer>
</main>

<script>
/* ============ EDIT THIS PART ============ */
var CONFIG = {
  name: "SeiTune",
  author: "mrk",
  tagline: "Free, ad-free music and video player for Android. Search YouTube, stream, download and play offline.",
  owner: "glmrkk09",
  repo: "SeiTune",

  /* app icon. a file next to this html, or a full link */
  icon: "logo.png",
  /* used when icon above fails to load */
  iconFallback: "https://raw.githubusercontent.com/glmrkk09/SeiTune/main/app/src/main/assets/logo.png",

  /* small badges under the tagline */
  tags: ["Free", "No ads", "No account", "Android 7.0+"],

  /* files ending with these are hidden from the site (still stay on the github release).
     .idsig are signing files, users do not need them */
  exclude: [".aab", ".idsig"],

  features: [
    ["Search and stream", "Songs, videos and playlists from YouTube with no ads."],
    ["Download", "Audio as M4A or MP3, video as MP4, one at a time or a whole playlist."],
    ["Offline and background", "Auto cache, local music folders, lock screen controls."],
    ["Lyrics", "Synced lyrics, with speech recognition when a song has none."]
  ],

  /* OPTIONAL manual list. if filled, it is shown instead of github releases.
     leave as [] to load releases from github automatically. */
  manualReleases: []
};
/* ========================================= */

(function(){
  var $ = function(id){ return document.getElementById(id); };
  var root = document.documentElement;

  function mk(tag, cls, text){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(text) e.textContent = text;
    return e;
  }

  try{ var t = localStorage.getItem("theme"); if(t) root.setAttribute("data-theme", t); }catch(e){}
  $("themeBtn").onclick = function(){
    var dark = root.getAttribute("data-theme") ? root.getAttribute("data-theme") === "dark"
      : !window.matchMedia("(prefers-color-scheme: light)").matches;
    var next = dark ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try{ localStorage.setItem("theme", next); }catch(e){}
  };

  document.title = CONFIG.name + " download";
  $("name").textContent = CONFIG.name;
  $("tagline").textContent = CONFIG.tagline;
  $("by").textContent = "by: " + CONFIG.author;
  var icon = $("icon");
  icon.onerror = function(){ icon.onerror = null; icon.src = CONFIG.iconFallback; };
  icon.src = CONFIG.icon;

  var repoUrl = "https://github.com/" + CONFIG.owner + "/" + CONFIG.repo;
  $("srcLink").href = repoUrl;
  $("issueLink").href = repoUrl + "/issues";
  $("foot").appendChild(mk("span", "", "Made with care. "));
  var fa = mk("a", "", "Source and issues on GitHub"); fa.href = repoUrl;
  $("foot").appendChild(fa);

  (CONFIG.tags || []).forEach(function(x){ $("tags").appendChild(mk("li", "", x)); });

  if(CONFIG.features && CONFIG.features.length){
    CONFIG.features.forEach(function(f){
      var li = mk("li");
      li.appendChild(mk("b", "", f[0]));
      li.appendChild(mk("span", "", f[1]));
      $("feat").appendChild(li);
    });
    $("featWrap").hidden = false;
  }

  /* ---------- tiny, safe markdown for the release notes (builds nodes, never injects html) ---------- */
  function inline(parent, text){
    var re = /(`[^`]+`)|(\*\*[^*]+\*\*)|(\[[^\]]+\]\((https?:\/\/[^)\s]+)\))/g;
    var last = 0, m;
    while((m = re.exec(text))){
      if(m.index > last) parent.appendChild(document.createTextNode(text.slice(last, m.index)));
      if(m[1]) parent.appendChild(mk("code", "", m[1].slice(1, -1)));
      else if(m[2]) parent.appendChild(mk("strong", "", m[2].slice(2, -2)));
      else {
        var a = mk("a", "", m[3].slice(1, m[3].indexOf("]")));
        a.href = m[4]; a.rel = "noopener";
        parent.appendChild(a);
      }
      last = re.lastIndex;
    }
    if(last < text.length) parent.appendChild(document.createTextNode(text.slice(last)));
  }
  function cells(line){
    return line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(function(c){ return c.trim(); });
  }
  function isSpecial(l){
    return /^\s*#{1,6}\s/.test(l) || /^\s*\|/.test(l) || /^\s*[-*]\s+/.test(l) || /^\s*\d+\.\s+/.test(l) || /^\s*(-{3,}|\*{3,})\s*$/.test(l);
  }
  function renderMd(src, target){
    target.innerHTML = "";
    var lines = String(src || "").replace(/\r\n?/g, "\n").split("\n");
    var i = 0;
    while(i < lines.length){
      var l = lines[i];
      if(!l.trim()){ i++; continue; }
      var h = /^\s*(#{1,6})\s+(.*)$/.exec(l);
      if(h){
        var el = mk(h[1].length >= 3 ? "h4" : "h3"); inline(el, h[2].replace(/\s*#+\s*$/, ""));
        target.appendChild(el); i++; continue;
      }
      if(/^\s*(-{3,}|\*{3,})\s*$/.test(l)){ target.appendChild(mk("hr")); i++; continue; }
      if(/^\s*\|/.test(l) && i + 1 < lines.length && /^\s*\|?[\s:|-]*-[\s:|-]*\|?\s*$/.test(lines[i + 1])){
        var wrap = mk("div", "tablewrap"), tb = mk("table"), th = mk("thead"), tr = mk("tr");
        cells(l).forEach(function(c){ var x = mk("th"); inline(x, c); tr.appendChild(x); });
        th.appendChild(tr); tb.appendChild(th);
        var body = mk("tbody"); i += 2;
        while(i < lines.length && /^\s*\|/.test(lines[i])){
          var r = mk("tr");
          cells(lines[i]).forEach(function(c){ var x = mk("td"); inline(x, c); r.appendChild(x); });
          body.appendChild(r); i++;
        }
        tb.appendChild(body); wrap.appendChild(tb); target.appendChild(wrap); continue;
      }
      var ul = /^\s*[-*]\s+/.test(l), ol = /^\s*\d+\.\s+/.test(l);
      if(ul || ol){
        var list = mk(ul ? "ul" : "ol");
        var rx = ul ? /^\s*[-*]\s+(.*)$/ : /^\s*\d+\.\s+(.*)$/;
        while(i < lines.length && rx.test(lines[i])){
          var li = mk("li"); inline(li, rx.exec(lines[i])[1]); list.appendChild(li); i++;
        }
        target.appendChild(list); continue;
      }
      var buf = [l.trim()]; i++;
      while(i < lines.length && lines[i].trim() && !isSpecial(lines[i])){ buf.push(lines[i].trim()); i++; }
      var p = mk("p"); inline(p, buf.join(" ")); target.appendChild(p);
    }
  }

  function fmtSize(n){
    if(typeof n === "string") return n;
    if(!n) return "";
    return n > 1048576 ? (n/1048576).toFixed(1) + " MB" : Math.round(n/1024) + " KB";
  }
  function fmtDate(s){
    if(!s) return "";
    var d = new Date(s); if(isNaN(d)) return s;
    return d.toLocaleDateString(undefined, {year:"numeric", month:"short", day:"numeric"});
  }

  function archOf(s){
    s = (s || "").toLowerCase();
    if(s.indexOf("arm64") > -1 || s.indexOf("v8a") > -1) return "arm64";
    if(s.indexOf("armeabi") > -1 || s.indexOf("v7a") > -1 || s.indexOf("arm32") > -1) return "arm32";
    if(s.indexOf("x86_64") > -1) return "x86_64";
    if(s.indexOf("x86") > -1) return "x86";
    return "other";
  }
  var INFO = {
    arm64:  { title: "64-bit phones", tag: "Most phones", desc: "Nearly every phone from the last several years, including all Android 11 and newer phones." },
    arm32:  { title: "32-bit phones", tag: "Older phones", desc: "Older or very low-end phones that cannot run 64-bit apps." },
    x86_64: { title: "x86_64", tag: "Emulators and Chromebooks", desc: "For Android emulators and some Chromebooks." },
    x86:    { title: "x86", tag: "Old emulators", desc: "For old 32-bit emulators." },
    other:  { title: "Android APK", tag: "All phones", desc: "" }
  };
  function fileLabel(name){
    var a = archOf(name);
    if(a === "other"){
      if(/\.apk$/i.test(name)) return "Android APK";
      if(/\.zip$/i.test(name)) return "Zip file";
      return name;
    }
    return "Android APK (" + INFO[a].title + ")";
  }

  function fromGithub(list){
    return list.filter(function(r){ return !r.draft; }).map(function(r){
      return {
        version: r.tag_name || r.name,
        title: r.name || r.tag_name,
        date: r.published_at,
        pre: r.prerelease,
        notes: (r.body || "").trim(),
        page: r.html_url,
        files: (r.assets || []).filter(function(x){
          var n = x.name.toLowerCase();
          return !(CONFIG.exclude || []).some(function(e){ return n.slice(-e.length) === e.toLowerCase(); });
        }).map(function(x){
          return { label: fileLabel(x.name), name: x.name, url: x.browser_download_url, size: fmtSize(x.size), arch: archOf(x.name) };
        }).sort(function(a, b){
          return (b.arch === "arm64") - (a.arch === "arm64");
        })
      };
    });
  }
  function fromManual(list){
    return list.map(function(r){
      return {
        version: r.version, title: r.version, date: r.date, notes: r.notes || "", pre: !!r.prerelease, page: r.page,
        files: (r.files || []).map(function(x){
          return { label: x.label || "Download", name: x.name || "", url: x.url, size: fmtSize(x.size), arch: archOf((x.name || "") + " " + (x.label || "") + " " + (x.url || "")) };
        })
      };
    });
  }

  function detect(){
    var ua = navigator.userAgent || "";
    if(!/Android/i.test(ua)) return Promise.resolve({ android: false, arch: null });
    if(/armv7|armv8l|armeabi/i.test(ua)) return Promise.resolve({ android: true, arch: "arm32" });
    var uad = navigator.userAgentData;
    if(uad && uad.getHighEntropyValues){
      return uad.getHighEntropyValues(["architecture", "bitness"]).then(function(v){
        var arch = v.bitness === "32" ? "arm32" : (v.bitness === "64" ? "arm64" : null);
        return { android: true, arch: arch };
      }).catch(function(){ return { android: true, arch: null }; });
    }
    return Promise.resolve({ android: true, arch: null });
  }

  var DL_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11"/><path d="M7 11l5 5 5-5"/><path d="M5 20h14"/></svg>';

  function bigBtn(f, sure){
    var info = INFO[f.arch] || INFO.other;
    var a = mk("a", "btn main"); a.href = f.url; a.rel = "noopener";
    var ico = mk("span", "ico"); ico.innerHTML = DL_ICON; // constant markup, no outside text
    a.appendChild(ico);
    var left = mk("div", "txt");
    left.appendChild(mk("span", "badge", sure ? "Picked for your phone" : "Recommended"));
    left.appendChild(mk("div", "", "Download " + CONFIG.name));
    left.appendChild(mk("small", "", info.tag + (f.name ? " \u00b7 " + f.name : "")));
    a.appendChild(left);
    a.appendChild(mk("span", "size", f.size));
    return a;
  }
  function smallBtn(f){
    var info = INFO[f.arch] || INFO.other;
    var a = mk("a", "btn"); a.href = f.url; a.rel = "noopener";
    var left = mk("div");
    left.appendChild(mk("div", "", info.title + " (" + info.tag.toLowerCase() + ")"));
    left.appendChild(mk("small", "", (info.desc ? info.desc + " " : "") + (f.name ? "(" + f.name + ")" : "")));
    a.appendChild(left);
    a.appendChild(mk("span", "size", f.size));
    return a;
  }

  function helpBox(){
    var det = mk("details", "help");
    var sum = mk("summary"); sum.appendChild(mk("span", "", "Not sure which one to pick?"));
    det.appendChild(sum);
    var body = mk("div", "body");
    [
      "<b>Your Android version does not matter here.</b> The file depends on your phone's processor, not on Android 11, 12, 13 and so on.",
      "<b>Most people:</b> use the big button (64-bit). It works on nearly all phones from the last several years.",
      "<b>If it says the app is not compatible or will not install:</b> try the 32-bit file. That is for older phones.",
      "<b>Updating an existing install:</b> download the same type you installed before, so the update installs cleanly."
    ].forEach(function(h){ var p = mk("p"); p.innerHTML = h; body.appendChild(p); }); // constant markup
    det.appendChild(body);
    return det;
  }

  function renderDownloads(latest, d){
    var box = $("downloads"); box.innerHTML = "";
    var files = latest.files;
    if(!files.length){
      box.appendChild(mk("p", "state", "This release has no files attached yet."));
      return;
    }
    var pref = d && d.arch ? d.arch : "arm64";
    var pick = null, i;
    for(i = 0; i < files.length; i++){ if(files[i].arch === pref){ pick = files[i]; break; } }
    if(!pick){ for(i = 0; i < files.length; i++){ if(files[i].arch === "arm64"){ pick = files[i]; break; } } }
    if(!pick) pick = files[0];
    var others = files.filter(function(f){ return f !== pick; });

    var wrap = mk("div", "dl");
    wrap.appendChild(bigBtn(pick, !!(d && d.arch && pick.arch === d.arch)));
    box.appendChild(wrap);

    if(d && d.android === false){
      box.appendChild(mk("p", "sub warn", "You are not on an Android phone. Open this page on your phone, or download here and copy the file over."));
    } else {
      box.appendChild(mk("p", "sub", "Works on Android 11 and newer, and most older phones too."));
    }

    if(others.length){
      box.appendChild(mk("div", "other-h", "Other versions"));
      var w2 = mk("div", "dl");
      others.forEach(function(f){ w2.appendChild(smallBtn(f)); });
      box.appendChild(w2);
    }
    box.appendChild(helpBox());
  }

  function render(releases){
    var box = $("downloads"); box.innerHTML = "";
    if(!releases.length){
      box.appendChild(mk("p", "state", "No release yet. Check back soon."));
      return;
    }
    var stable = releases.filter(function(r){ return !r.pre; });
    var latest = stable[0] || releases[0];

    $("ver").hidden = false;
    $("ver").innerHTML = "";
    $("ver").appendChild(mk("span", "pill", latest.version));
    $("ver").appendChild(mk("span", "", fmtDate(latest.date)));

    renderDownloads(latest, null);
    detect().then(function(d){ renderDownloads(latest, d); });

    if(latest.notes){ renderMd(latest.notes, $("notes")); $("notesWrap").hidden = false; }

    var rest = releases.filter(function(r){ return r !== latest; });
    if(rest.length){
      rest.forEach(function(r){
        var det = mk("details");
        var sum = mk("summary");
        sum.appendChild(mk("span", "", r.version + (r.pre ? " (pre-release)" : "")));
        sum.appendChild(mk("span", "d", fmtDate(r.date)));
        det.appendChild(sum);
        var body = mk("div", "old");
        r.files.forEach(function(f){
          var a = mk("a", "file"); a.href = f.url; a.rel = "noopener";
          a.appendChild(mk("span", "", f.name || f.label));
          a.appendChild(mk("span", "", f.size));
          body.appendChild(a);
        });
        if(r.notes){ var nt = mk("div", "notes"); renderMd(r.notes, nt); body.appendChild(nt); }
        det.appendChild(body); $("old").appendChild(det);
      });
      $("oldWrap").hidden = false;
    }
  }

  function fail(){
    var box = $("downloads"); box.innerHTML = "";
    var p = mk("p", "state err", "Could not load releases. ");
    var a = mk("a", "", "Open the releases page on GitHub"); a.href = repoUrl + "/releases";
    p.appendChild(a); box.appendChild(p);
  }

  if(CONFIG.manualReleases && CONFIG.manualReleases.length){
    render(fromManual(CONFIG.manualReleases));
  } else {
    fetch("https://api.github.com/repos/" + CONFIG.owner + "/" + CONFIG.repo + "/releases?per_page=15",
          { headers: { "Accept": "application/vnd.github+json" } })
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(j){ render(fromGithub(j)); })
      .catch(fail);
  }
})();
</script>
</body>
</html>
